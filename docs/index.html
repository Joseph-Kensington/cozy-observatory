<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cozy 平行宇宙故事接龙</title>
<style>
:root{--ink:#302e2a;--muted:#777067;--paper:#fffdf8;--cream:#f5efe5;--orange:#df7049;--line:#ded4c5}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--ink);background:radial-gradient(circle at 85% 5%,#f0ddc4,transparent 27%),var(--cream)}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1100px;margin:auto;min-height:100vh;padding:26px}.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.08em}.mark{display:inline-grid;place-items:center;background:var(--orange);color:white;border-radius:50%;width:28px;height:28px;margin-right:8px}.home{padding:11vh 6%}.eyebrow{color:var(--orange);letter-spacing:.12em;font-size:13px}.hero h1{font-size:clamp(42px,7vw,78px);line-height:1.03;margin:12px 0}.hero em,h2 em{font-family:Georgia,serif;color:var(--orange);font-weight:400}.hero p{color:var(--muted);line-height:1.8}.primary,.pale,.text{padding:13px 18px;border-radius:10px}.primary{background:var(--orange);color:#fff}.pale{background:var(--paper);border:1px solid var(--line)}.text{background:transparent;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0}.rules{display:flex;gap:20px;margin-top:70px}.rules div{border-top:1px solid var(--line);padding-top:12px;min-width:120px}.rules b,.rules span{display:block}.rules span{font-size:12px;color:var(--muted);margin-top:4px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:28px;margin-top:40px}.card{background:var(--paper);border:1px solid #ebe3d6;border-radius:16px;padding:22px;box-shadow:0 10px 30px #624b2d0b}.openings{display:grid;gap:10px;margin-top:18px}.opening{padding:14px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--paper)}.opening.active{border-color:var(--orange);background:#fff5ed}.opening small{color:var(--orange)}.opening b,.opening span{display:block;margin:5px 0}.opening p{font-size:13px;line-height:1.55;color:var(--muted);margin:4px 0}.people{display:flex;gap:8px;margin:8px 0 20px}.people button{width:48px;padding:10px;border-radius:9px;border:1px solid var(--line);background:white}.people button.active{background:#fff0e6;border-color:var(--orange)}label{display:block;font-size:13px;margin-top:14px;color:var(--muted)}input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:5px;background:white}.names{display:grid;grid-template-columns:1fr 1fr;gap:7px}.playhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.pill{background:#e8edf0;border-radius:99px;padding:7px 12px;font-size:13px}.manuscript{min-height:530px}.manuscript h2{font-size:30px}.openingtext{line-height:1.8;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:16px}.line{line-height:1.8;margin:13px 0}.line b{color:var(--orange);margin-right:8px}.timer{text-align:center;font-size:52px;font-family:Georgia,serif;color:var(--orange)}.timer small{font-size:14px}.hint{background:#f7efe5;padding:12px;border-radius:9px;line-height:1.6;margin:12px 0}.egg{background:#fff2df;border:1px dashed #d99b57;padding:13px;border-radius:10px;margin:12px 0}.egg small{display:block;color:var(--muted);margin-bottom:4px}.tools{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tools button{background:white;border:1px solid var(--line);padding:7px 9px;border-radius:8px;font-size:12px}textarea{width:100%;height:135px;border:1px solid var(--line);border-radius:10px;padding:12px;line-height:1.65;background:#fff}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.notice{font-size:12px;color:var(--muted)}.poster{max-width:720px;margin:28px auto;background:var(--paper);padding:40px;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 25px #60492512}.poster h2{font-size:34px;text-align:center}.ending{margin-top:20px;background:#fff0e8;padding:15px;border-radius:10px;line-height:1.6}.archive article{margin:12px 0;padding:16px;background:var(--paper);border:1px solid var(--line);border-radius:10px}.archive small{color:var(--muted)}@media(max-width:720px){.app{padding:18px}.home{padding:8vh 0}.grid{grid-template-columns:1fr}.rules{margin-top:42px;gap:10px}.rules div{min-width:0;flex:1}.playhead{gap:8px;font-size:12px}.names{grid-template-columns:1fr}.poster{padding:22px}.bottom{align-items:flex-end}}
</style></head><body><div id="app" class="app"></div><script>
const openings=[['中奖彩票','{{主角}}下班路上发现自己中了五百万，但兑奖截止时间是明天上午九点。','日常意外'],['旧沙发','{{主角}}在二手平台买了一张旧沙发，送到家后发现夹层里有一份没走完的旅行计划。','日常意外'],['未来转账','{{主角}}收到一条银行到账提醒，备注只有一句：“替三十岁的你收下。”','轻微奇幻'],['凌晨冰箱','{{主角}}搬进新租的房子，第一晚发现冰箱每天凌晨都会自动补满一种食物。','轻微奇幻'],['错拿行李箱','{{主角}}在机场拿错了行李箱，里面只有一台拍立得和一张写着地址的车票。','旅行与偶遇'],['周末静音','{{主角}}决定周末不看手机，结果周六早上门口出现了一只会按门铃的猫。','轻微奇幻']];
const verbs=['打开','翻找','查看','确认','靠近','绕路','跟上','记录','比较','买下','带走','留下','修改','发消息','询问','邀请','分享','出发','回家','拍照'];
const eggs=['必须出现一张皱巴巴的小票。','突然收到一条只有三个句号的消息。','必须出现一杯快凉掉的咖啡。','有人认真地问：“那晚饭怎么办？”','必须出现一个打不开的抽屉。','必须有人假装自己早就知道这件事。','必须出现一把不知道是谁留下的伞。','手机电量刚好只剩 1%。','必须有一段语音自动播放出来。','必须出现一张写着“别着急”的便利贴。'];
const endings=['原来这件事没有改变世界，但让主角重新安排了接下来的周末。','大家没有找到标准答案，却找到了一家值得再去的小店。','事情恢复正常，只是从那天起，主角多了一个新的习惯。','最终没人变得更厉害，但每个人都轻松了一点。'];
const pick=a=>a[Math.floor(Math.random()*a.length)];let state={page:'home',people:6,names:['玩家 1','玩家 2','玩家 3','玩家 4','玩家 5','玩家 6'],opening:openings[0],lines:[],egg:'',used:[],draft:'',seconds:20,running:false,ending:'',protagonist:'这位主角'};const app=document.querySelector('#app');
function save(){localStorage.setItem('cozy-github-game',JSON.stringify(state))}function load(){try{let x=JSON.parse(localStorage.getItem('cozy-github-game'));if(x&&x.lines?.length)state=x}catch{}}
function openingText(o=state.opening){return o[1].replaceAll('{{主角}}',state.protagonist.trim()||'这位主角')}\nfunction header(back){return '<header class="top"><div><span class="mark">C</span>COZY CLUB</div>'+ (back?'<button class="text" onclick="go(\'home\')">← 返回首页</button>':'<span>线下故事接龙工具</span>')+'</header>'}
function go(page){state.page=page;state.running=false;render()}function setup(){state.lines=[];state.used=[];state.egg='';state.draft='';state.seconds=20;state.ending='';state.names=Array.from({length:state.people},(_,i)=>state.names[i]||'玩家 '+(i+1));go('play')}
function render(){let p=state.page;if(p==='home')app.innerHTML=header()+ '<main class="home"><p class="eyebrow">把普通日子，讲成一个意外</p><section class="hero"><h1>Cozy<br><em>平行宇宙</em><br>故事接龙</h1><p>每个人接一句。生活化开头、轻微的意外，最后一起把故事带到一个好笑又温暖的地方。</p><div class="actions"><button class="primary" onclick="go(\'setup\')">开始一桌新故事 →</button><button class="text" onclick="randomStart()">给我一个随机开头</button>'+ (localStorage.getItem('cozy-github-game')?'<button class="pale" onclick="resume()">继续上次故事</button>':'')+'</div></section><section class="rules"><div><b>4–6 人</b><span>一桌刚刚好</span></div><div><b>20 秒</b><span>想到了就说</span></div><div><b>每人一句</b><span>公平地接一次</span></div></section></main>';
else if(p==='setup')app.innerHTML=header(true)+'<div class="grid"><section><p class="eyebrow">这一桌，怎么开始？</p><h2>先挑一个<br><em>生活里的小意外</em></h2><div class="openings">'+openings.map((o,i)=>'<button class="opening '+(state.opening[0]===o[0]?'active':'')+'" onclick="selectOpening('+i+')"><small>'+o[2]+'</small><b>'+o[0]+'</b><p>'+openingText(o)+'</p></button>').join('')+'</div></section><aside class="card"><p class="eyebrow">本桌设置</p><label>这一桌有几位？</label><div class="people">'+[4,5,6].map(n=>'<button class="'+(state.people===n?'active':'')+'" onclick="setPeople('+n+')">'+n+' 人</button>').join('')+'</div><label>给玩家起个轻松的称呼（可改）</label><div class="names">'+state.names.slice(0,state.people).map((n,i)=>'<input value="'+n+'" oninput="state.names['+i+']=this.value">').join('')+'</div><label>故事主角（可按自己的方式填写）</label><div class="people">'+['这位主角','我','朋友','一位路人','一只猫'].map(x=>'<button class="'+(state.protagonist===x?'active':'')+'" onclick="chooseProtagonist(\\\''+x+'\\\')">'+x+'</button>').join('')+'</div><input value="'+state.protagonist+'" oninput="state.protagonist=this.value" placeholder="例如：小悠、隔壁邻居、一只会按门铃的猫"><div class="hint"><b>'+state.opening[0]+'</b><br>'+openingText()+'</div><button class="primary" onclick="setup()">开始接龙 →</button></aside></div>';
else if(p==='play')play();else if(p==='end')end();else archive()}
function play(){let r=state.lines.length+1, egg=(r===3||r===5)?state.egg:'', a=[pick(verbs),pick(verbs)];app.innerHTML=header(true)+'<div class="playhead"><span class="pill">第 '+r+' / '+state.people+' 轮</span><b>轮到 '+state.names[(r-1)%state.people]+'</b></div><div class="grid"><section class="card manuscript"><small>平行宇宙编辑部 · 本桌存档</small><h2>'+state.opening[0]+'</h2><p class="openingtext">'+openingText()+'</p>'+(state.lines.length?state.lines.map(x=>'<p class="line"><b>'+x.r+'.</b>'+x.text+'</p>').join(''):'<p class="notice">故事正等着第一句话。</p>')+'</section><aside class="card"><div class="timer">'+String(state.seconds).padStart(2,'0')+'<small> 秒</small></div><div class="tools"><button onclick="toggleTimer()">'+(state.running?'暂停':'开始计时')+'</button><button onclick="more()">+10 秒</button><button onclick="render()">换动作</button><button onclick="skip()">跳过本轮</button></div><p>这一句请放进 <b>两个动作</b> 和 <b>一个结果</b>。</p><div class="hint">可借用的动作：<b>'+a[0]+'</b>、<b>'+a[1]+'</b></div>'+(egg?'<div class="egg"><small>本轮彩蛋</small><b>'+egg+'</b></div>':'')+'<textarea id="draft" placeholder="谁，做了什么，又做了什么，结果发生了什么。">'+state.draft+'</textarea><div class="bottom"><span class="notice">少于 10 个字会提示补充。</span><button class="primary" onclick="submit()">接下去 →</button></div></aside></div>'}
function selectOpening(i){state.opening=openings[i];render()}function chooseProtagonist(value){state.protagonist=value;render()}function setPeople(n){state.people=n;state.names=Array.from({length:n},(_,i)=>state.names[i]||'玩家 '+(i+1));render()}function randomStart(){state.opening=pick(openings);go('setup')}function resume(){load();go('play')}function toggleTimer(){state.running=!state.running;render();if(state.running)tick()}function tick(){if(!state.running)return;setTimeout(()=>{if(state.running&&state.seconds>0){state.seconds--;render();tick()}},1000)}function more(){state.seconds+=10;state.running=true;render();tick()}function nextEgg(next){if(next===3||next===5){let available=eggs.filter(x=>!state.used.includes(x));state.egg=pick(available);state.used.push(state.egg)}else state.egg=''}function submit(){let t=document.querySelector('#draft').value.trim();if(t.length<10){alert('再补一点点，让下一位更容易接下去。');return}state.lines.push({r:state.lines.length+1,text:t});let next=state.lines.length+1;nextEgg(next);state.draft='';state.seconds=20;state.running=false;save();if(state.lines.length===state.people){state.ending=pick(endings);localStorage.removeItem('cozy-github-game');go('end')}else render()}function skip(){state.lines.push({r:state.lines.length+1,text:'（这一轮选择留白，把句子交给下一次灵感。）'});nextEgg(state.lines.length+1);save();if(state.lines.length===state.people){state.ending=pick(endings);go('end')}else render()}function end(){app.innerHTML=header(true)+'<section class="poster"><p class="eyebrow">故事已完成</p><h2>《'+state.opening[0]+'》</h2><p class="openingtext">'+openingText()+'</p>'+state.lines.map(x=>'<p class="line"><b>'+x.r+'.</b>'+x.text+'</p>').join('')+'<div class="ending"><b>温暖收尾</b><br>'+state.ending+'</div><div class="actions"><button class="primary" onclick="archiveSave()">保存到故事档案</button><button class="pale" onclick="copy()">复制故事文本</button><button class="pale" onclick="window.print()">打印 / 存为 PDF</button><button class="text" onclick="go(\'setup\')">再来一局</button></div></section>'}function archiveSave(){let a=JSON.parse(localStorage.getItem('cozy-github-archives')||'[]');a.unshift({...state,id:Date.now(),saved:new Date().toLocaleString('zh-CN')});localStorage.setItem('cozy-github-archives',JSON.stringify(a));alert('已保存到故事档案。')}function copy(){navigator.clipboard.writeText('《'+state.opening[0]+'》\n'+openingText()+'\n'+state.lines.map(x=>x.r+'. '+x.text).join('\n')+'\n结尾：'+state.ending);alert('故事已复制。')}function archive(){let a=JSON.parse(localStorage.getItem('cozy-github-archives')||'[]');app.innerHTML=header(true)+'<section class="archive"><p class="eyebrow">故事档案</p><h2>之前玩过的，都在这里。</h2>'+a.map(s=>'<article><small>'+s.saved+'</small><h3>《'+s.opening[0]+'》</h3><p>'+s.lines.map(x=>x.r+'. '+x.text).join('<br>')+'</p></article>').join('')+'</section>'}load();render();
</script></body></html>
